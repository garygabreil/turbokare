@if (loading()) {
  <div class="page-loading" role="status" aria-live="polite" aria-busy="true">
    <div class="page-loading__inner">
      <div class="spinner-border text-primary page-loading__spinner" aria-hidden="true"></div>
      <p class="page-loading__text mb-0">{{ message() }}</p>
    </div>
  </div>
} @else {
  <ng-content />
}
