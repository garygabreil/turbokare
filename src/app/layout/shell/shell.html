<div class="shell">
  <!-- Top navbar -->
  <nav class="navbar navbar-dark bg-brand sticky-top shadow-sm px-3">
    <div class="d-flex align-items-center gap-2">
      <button
        class="btn btn-outline-light d-lg-none"
        type="button"
        data-bs-toggle="offcanvas"
        data-bs-target="#sidebar"
        aria-controls="sidebar"
        aria-label="Toggle navigation"
      >
        <i class="bi bi-list"></i>
      </button>
      <a class="navbar-brand d-flex align-items-center gap-2 mb-0" routerLink="/dashboard">
        <i class="bi bi-wrench-adjustable-circle"></i>
        <span class="fw-semibold">Garage Manager</span>
      </a>
    </div>

    <div class="dropdown">
      <button
        class="btn btn-outline-light dropdown-toggle d-flex align-items-center gap-2"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <i class="bi bi-person-circle"></i>
        <span class="d-none d-sm-inline">{{ user()?.name }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li>
          <span class="dropdown-item-text small text-muted">{{ user()?.email }}</span>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li>
          <button class="dropdown-item" type="button" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i>Sign out
          </button>
        </li>
      </ul>
    </div>
  </nav>

  <div class="shell-body">
    <!-- Sidebar: static on desktop, offcanvas on mobile -->
    <div
      class="offcanvas-lg offcanvas-start sidebar bg-white border-end"
      tabindex="-1"
      id="sidebar"
    >
      <div class="offcanvas-header d-lg-none">
        <h5 class="offcanvas-title">Menu</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="offcanvas"
          data-bs-target="#sidebar"
          aria-label="Close"
        ></button>
      </div>
      <div class="offcanvas-body p-0">
        <ul class="nav flex-column py-3">
          @for (item of navItems; track item.path) {
            <li class="nav-item">
              <a
                class="nav-link d-flex align-items-center gap-2 px-3 py-2"
                [routerLink]="item.path"
                routerLinkActive="active"
                data-bs-dismiss="offcanvas"
                data-bs-target="#sidebar"
              >
                <i class="bi {{ item.icon }}"></i>
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    </div>

    <!-- Main content -->
    <main class="content flex-grow-1 p-3 p-md-4">
      <router-outlet />
    </main>
  </div>
</div>
