<app-page-loading [loading]="loading()" message="Loading invoice…">
  @if (invoice(); as inv) {
    <div class="invoice-print-toolbar no-print d-flex flex-wrap align-items-center gap-2 mb-3">
      <a routerLink="/invoices" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <button type="button" class="btn btn-sm btn-primary" (click)="print()">
        <i class="bi bi-printer me-1"></i>Print A4
      </button>
      <button
        type="button"
        class="btn btn-sm btn-outline-primary"
        (click)="downloadPdf()"
        [disabled]="downloading()"
      >
        <i class="bi bi-download me-1"></i>{{ downloading() ? 'Generating…' : 'Download PDF' }}
      </button>
      <span class="small text-muted auth-hint">Press Enter or Ctrl+P to print</span>
      <a [routerLink]="['/invoices', inv.id, 'edit']" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-pencil me-1"></i>Edit
      </a>
    </div>

    <app-invoice-print-sheet
      [invoice]="inv"
      [customer]="customer()"
      [jobCard]="jobCard()"
      [vehicle]="vehicle()"
    />
  } @else {
    <div class="alert alert-warning no-print">Invoice not found.</div>
  }
</app-page-loading>
