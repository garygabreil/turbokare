<app-page-loading [loading]="loading()" message="Loading part…">
<div class="d-flex align-items-center gap-2 mb-4">
  <a routerLink="/inventory" class="btn btn-sm btn-outline-secondary">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 class="h3 page-title mb-0">{{ isEdit ? 'Edit' : 'Add' }} Part</h1>
</div>

<div class="card">
  <div class="card-body">
    <form [formGroup]="form" (ngSubmit)="submit()" appFormKeyboard novalidate class="row g-3">
      <div class="col-12 col-md-6">
        <label class="form-label" for="name">Part name <span class="text-danger">*</span></label>
        <input
          id="name"
          type="text"
          class="form-control"
          formControlName="name"
          placeholder="e.g. brake pad, engine oil"
          [class.is-invalid]="invalid('name')"
        />
        @if (invalid('name')) {
          <div class="invalid-feedback">Part name is required.</div>
        }
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="sku">SKU <span class="text-danger">*</span></label>
        <input
          id="sku"
          type="text"
          class="form-control text-uppercase"
          formControlName="sku"
          placeholder="e.g. BP-001"
          [class.is-invalid]="invalid('sku')"
        />
        @if (invalid('sku')) {
          <div class="invalid-feedback">SKU is required.</div>
        }
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="category">Category</label>
        <input id="category" type="text" class="form-control" formControlName="category" placeholder="e.g. filters, brakes" />
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="unitPrice">Unit price (₹) <span class="text-danger">*</span></label>
        <div class="input-group">
          <span class="input-group-text">₹</span>
          <input
            id="unitPrice"
            type="number"
            step="0.01"
            class="form-control"
            formControlName="unitPrice"
            placeholder="0.00"
            [class.is-invalid]="invalid('unitPrice')"
          />
        </div>
        @if (invalid('unitPrice')) {
          <div class="invalid-feedback">Enter a valid price.</div>
        }
      </div>

      <div class="col-12 col-md-6">
        <label class="form-label" for="quantity">Quantity in stock <span class="text-danger">*</span></label>
        <input
          id="quantity"
          type="number"
          class="form-control"
          formControlName="quantity"
          placeholder="0"
          [class.is-invalid]="invalid('quantity')"
        />
        @if (invalid('quantity')) {
          <div class="invalid-feedback">Enter a valid quantity.</div>
        }
      </div>

      <div class="col-12 d-flex gap-2">
        <button type="submit" class="btn btn-primary" [disabled]="submitting()">
          @if (submitting()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          {{ isEdit ? 'Update' : 'Save' }}
        </button>
        <a routerLink="/inventory" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
</app-page-loading>
